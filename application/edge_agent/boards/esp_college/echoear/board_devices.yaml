version: 1.0.0
# EchoEar device inventory and driver configuration.
# Source: D:/workspace/xbell_esp32/main/boards/echoear/config.h
devices:
  - name: audio_power
    type: gpio_ctrl
    version: default
    config:
      active_level: 1
      default_level: 0
    peripherals:
      - name: gpio_power_audio

  - name: lcd_sdcard_power
    type: power_ctrl
    sub_type: gpio
    peripherals:
      - name: gpio_power_lcd_sdcard
        active_level: 0

  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config:
      default_percent: 100
    peripherals:
      - name: ledc_backlight

  - name: audio_dac
    chip: es8311
    type: audio_codec
    version: default
    config:
      adc_enabled: false
      dac_enabled: true
      dac_max_channel: 1
      dac_channel_mask: "1"
      dac_init_gain: 0
      mclk_enabled: true
    peripherals:
      - name: gpio_pa_control
        gain: 6
        active_level: 1
      - name: i2s_audio_out
      - name: i2c_master
        address: 0x30
        frequency: 400000

  - name: audio_adc
    chip: es7210
    type: audio_codec
    version: default
    config:
      adc_enabled: true
      adc_max_channel: 4
      adc_channel_mask: "0111"
      adc_channel_labels: ["NA", "RE", "FR", "FL"]
      adc_init_gain: 0
    peripherals:
      - name: i2s_audio_in
      - name: i2c_master
        address: 0x80
        frequency: 400000

  - name: fs_sdcard
    type: fs_fat
    sub_type: sdmmc
    power_ctrl_device: lcd_sdcard_power
    version: default
    init_skip: true
    config:
      vfs_config:
        format_if_mount_failed: true
      sub_config:
        bus_width: 1
        slot_flags: "SDMMC_SLOT_FLAG_INTERNAL_PULLUP"
        pins:
          clk: 16
          cmd: 38
          d0: 17

  - name: display_lcd
    chip: st77916
    type: display_lcd
    sub_type: spi
    power_ctrl_device: lcd_sdcard_power
    version: default
    dependencies:
      espressif/esp_lcd_st77916: "*"
    config:
      x_max: 360
      y_max: 360
      need_reset: false
      swap_xy: false
      mirror_x: false
      mirror_y: false
      io_spi_config:
        cs_gpio_num: 14
        dc_gpio_num: -1
        spi_mode: 0
        lcd_cmd_bits: 32
        flags:
          quad_mode: true
      lcd_panel_config:
        reset_gpio_num: 3
        flags:
          reset_active_high: false
        vendor_config: NULL
    peripherals:
      - name: spi_display

  - name: lcd_touch
    chip: cst816s
    type: lcd_touch
    sub_type: i2c
    version: default
    dependencies:
      espressif/esp_lcd_touch_cst816s: "*"
    config:
      io_i2c_config: {}
      touch_config:
        x_max: 360
        y_max: 360
        int_gpio_num: 10
        rst_gpio_num: -1
        flags:
          swap_xy: false
          mirror_x: false
          mirror_y: false
    peripherals:
      - name: i2c_master
        i2c_addr: 0x2a

  - name: imu_sensor
    chip: bmi270
    type: custom
    version: 1.0.0
    init_skip: true
    config:
      i2c_addr: 0x68
      frequency: 400000
      int_gpio_num: -1
      alt_i2c_addr: 0x69
    peripherals:
      - name: i2c_master

  - name: touch_keys
    chip: esp32s3_touch
    type: custom
    version: 1.0.0
    init_skip: true
    config:
      key1_gpio_num: 7
      key2_gpio_num: -1
      threshold_milli: 15

  - name: boot_button
    chip: gpio_button
    type: custom
    version: 1.0.0
    init_skip: true
    config:
      button_boot_gpio: 0
      active_level: 0

  - name: led_green
    type: gpio_ctrl
    version: default
    config:
      active_level: 0
      default_level: 1
    peripherals:
      - name: gpio_led_g

  - name: nfc_eye_uart
    chip: uart
    type: custom
    version: 1.0.0
    init_skip: true
    config:
      port_num: 1
      tx_gpio_num: 4
      rx_gpio_num: 5
      baud_rate: 115200
      duplicate_interval_ms: 2000

  - name: hrv_uart
    chip: uart
    type: custom
    version: 1.0.0
    init_skip: true
    config:
      port_num: 2
      tx_gpio_num: 45
      rx_gpio_num: 8
      baud_rate: 38400
      frame_size: 88

  - name: gsr_adc
    chip: esp32s3_adc
    type: custom
    version: 1.0.0
    init_skip: true
    config:
      unit_id: ADC_UNIT_1
      channel: ADC_CHANNEL_5
      gpio_num: 6
      atten: ADC_ATTEN_DB_12
      bitwidth: ADC_BITWIDTH_12
